<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CondoConnect</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/style.css">
    <meta name="theme-color" content="#2e7d32">
</head>
<body>
    <h1>CondoConnect - Painel do Condomínio</h1>

    <!-- 1. Lista de Manutenções -->
    <div id="jardinagem-container">
        <h2>🗓️ Próximas Manutenções no Jardim</h2>
        <ul id="lista-jardinagem"></ul>
    </div>

    <!-- 2. Formulário do Síndico -->
    <section id="form-jardinagem-container">
        <h2>➕ Agendar Manutenção de Jardinagem</h2>
        <form id="form-jardinagem">
            <div class="campo">
                <label for="atividade">Atividade:</label>
                <input type="text" id="atividade" placeholder="Ex: Poda das árvores" required>
            </div>

            <div class="campo">
                <label for="data">Data Agendada:</label>
                <input type="date" id="data" required>
            </div>

            <div class="campo">
                <label for="status">Status:</label>
                <select id="status">
                    <option value="Agendado">Agendado</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Concluído">Concluído</option>
                </select>
            </div>

            <div class="campo">
                <label for="observacao">Observações (opcional):</label>
                <textarea id="observacao" placeholder="Ex: Contratada equipe terceirizada"></textarea>
            </div>

            <button type="submit" id="btn-salvar">Salvar Agendamento</button>
        </form>
    </section>

    <!-- 3. Seção de Chamados dos Moradores -->
    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

    <div id="chamados-container">
        <h2>🛠️ Chamados e Reparos</h2>
        <ul id="lista-chamados"></ul>
    </div>

    <section id="form-chamados-container">
        <h2>📢 Abrir Novo Chamado</h2>
        <form id="form-chamado">
            <div class="campo">
                <label for="apartamento">Apartamento / Bloco:</label>
                <input type="text" id="apartamento" placeholder="Ex: Apt 302 - Bloco B" required>
            </div>

            <div class="campo">
                <label for="categoria">Categoria:</label>
                <select id="categoria">
                    <option value="Elétrica">⚡ Elétrica (Lâmpada, tomada, etc.)</option>
                    <option value="Hidráulica">🚰 Hidráulica (Vazamento, cano, etc.)</option>
                    <option value="Estrutural">🧱 Estrutural (Portão, pintura, etc.)</option>
                    <option value="Geral">📦 Outros / Geral</option>
                </select>
            </div>

            <div class="campo">
                <label for="prioridade">Prioridade:</label>
                <select id="prioridade">
                    <option value="Baixa">🟢 Baixa</option>
                    <option value="Média" selected>🟡 Média</option>
                    <option value="Alta">🔴 Alta (Urgente)</option>
                </select>
            </div>

            <div class="campo">
                <label for="descricao-chamado">Descrição do Problema:</label>
                <textarea id="descricao-chamado" placeholder="Descreva o reparo necessário detalhadamente..." required></textarea>
            </div>

            <button type="submit" id="btn-salvar-chamado" style="background-color: #d97706;">Registrar Chamado</button>
        </form>
    </section>

    <!-- Chamada única do JavaScript -->
    <script src="assets/app.js"></script>
</body>
</html>
